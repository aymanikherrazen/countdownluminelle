<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luminelle — Notice Bar Pro v3</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  .nb {
    background: #36b2fe;
    width: 100%;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    font-family: 'Poppins', sans-serif;
  }

  .nb-msg {
    position: absolute;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    padding: 0 16px;
    text-align: center;
  }

  .nb-msg.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* Style dyal l-Timer l-jdid */
  .nb-timer {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    padding: 3px 10px;
    color: #FFD700;
  }

  .t-unit {
    display: flex;
    align-items: baseline;
    gap: 1px;
    font-weight: 700;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  /* L-hrouf sghar (h, m, s) */
  .t-label {
    font-size: 9px;
    text-transform: uppercase;
    opacity: 0.8;
    margin-left: 1px;
  }

  .nb-dot {
    width: 5px;
    height: 5px;
    background: #FFD700;
    border-radius: 50%;
    flex-shrink: 0;
  }

  @media(max-width: 480px){
    .nb { height: 38px; }
    .nb-msg { font-size: 10px; gap: 6px; }
    .t-unit { font-size: 11px; }
    .t-label { font-size: 7px; }
    .nb-dot { display: none; }
  }
</style>
</head>
<body>

<div class="nb" role="status" aria-live="polite">
  <div class="nb-msg active" id="msg1">
    <span class="nb-dot"></span>
    <span>Fin de la Promo Ce Soir À Minuit ⏳</span>
    <div class="nb-timer" id="timer-container">
      <div class="t-unit"><span id="h">00</span><span class="t-label">h</span></div>
      <div class="t-unit"><span id="m">00</span><span class="t-label">m</span></div>
      <div class="t-unit"><span id="s">00</span><span class="t-label">s</span></div>
    </div>
    <span class="nb-dot"></span>
  </div>
  
  <div class="nb-msg" id="msg2">
    <span class="nb-dot"></span>
    <span>-20% sur Toute la Gamme Pendant 24h Seulement</span>
    <span class="nb-dot"></span>
  </div>
</div>

<script>
(function(){
  var m1 = document.getElementById('msg1'), 
      m2 = document.getElementById('msg2'),
      elH = document.getElementById('h'),
      elM = document.getElementById('m'),
      elS = document.getElementById('s'),
      cur = 1;

  function pad(n) { return n < 10 ? '0' + n : n; }

  function tick() {
    var now = new Date(), end = new Date();
    end.setHours(23, 59, 59, 999);
    var diff = end - now;
    if (diff < 0) diff = 0;
    
    var h = Math.floor(diff / 3600000), 
        m = Math.floor((diff % 3600000) / 60000), 
        s = Math.floor((diff % 60000) / 1000);
    
    elH.textContent = pad(h);
    elM.textContent = pad(m);
    elS.textContent = pad(s);
  }
  
  tick();
  setInterval(tick, 1000);

  function swap() {
    if (cur === 1) {
      m1.classList.remove('active');
      setTimeout(function() { m2.classList.add('active'); }, 600);
      cur = 2;
    } else {
      m2.classList.remove('active');
      setTimeout(function() { m1.classList.add('active'); }, 600);
      cur = 1;
    }
  }
  setInterval(swap, 5000);
})();
</script>

</body>
</html>
