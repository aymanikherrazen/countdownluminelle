<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luminelle — Notice Bar v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
.nb{background:#083D77;width:100%;height:40px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.nb-msg{position:absolute;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Montserrat','Segoe UI',sans-serif;font-size:13px;font-weight:700;color:#fff;letter-spacing:.03em;opacity:0;transition:opacity .6s ease;pointer-events:none;padding:0 16px;text-align:center}
.nb-msg.active{opacity:1;pointer-events:auto}
.nb-dot{width:6px;height:6px;background:rgba(255,255,255,.4);border-radius:50%;flex-shrink:0}
.nb-timer{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.15);border-radius:4px;padding:2px 8px;font-size:12px;font-weight:700;letter-spacing:.05em;flex-shrink:0}
@media(max-width:480px){
  .nb{height:36px}
  .nb-msg{font-size:11px;gap:6px}
  .nb-timer{font-size:10px;padding:2px 6px}
  .nb-dot{display:none}
}
</style>
</head>
<body>

<div class="nb" role="status" aria-live="polite">
  <div class="nb-msg active" id="msg1">
    <span class="nb-dot"></span>
    <span>Fin de la Promo Ce Soir À Minuit ⏳</span>
    <span class="nb-timer" id="timer">--:--:--</span>
    <span class="nb-dot"></span>
  </div>
  <div class="nb-msg" id="msg2">
    <span class="nb-dot"></span>
    <span>-20% sur Toute la Gamme Pendant 24h Seulement</span>
    <span class="nb-dot"></span>
  </div>
</div>

<script>
(function(){
  var m1=document.getElementById('msg1'),m2=document.getElementById('msg2'),t=document.getElementById('timer'),cur=1;

  function pad(n){return n<10?'0'+n:n}

  function tick(){
    var now=new Date(),end=new Date();
    end.setHours(23,59,59,999);
    var diff=end-now;
    if(diff<0)diff=0;
    var h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
    t.textContent=pad(h)+':'+pad(m)+':'+pad(s);
  }
  tick();
  setInterval(tick,1000);

  function swap(){
    if(cur===1){m1.classList.remove('active');setTimeout(function(){m2.classList.add('active')},300);cur=2;}
    else{m2.classList.remove('active');setTimeout(function(){m1.classList.add('active')},300);cur=1;}
  }
  setInterval(swap,5000);
})();
</script>

</body>
</html>
